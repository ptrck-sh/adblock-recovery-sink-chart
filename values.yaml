image:
  repository: registry.gitlab.com/ptrck-sh/adblock-recovery-sink
  pullPolicy: IfNotPresent
  tag: ""
  digest: ""

nameOverride: ""
fullnameOverride: ""

replicaCount: 1

imagePullSecrets: []

interception:
  hosts:
    - html-load.com

profiles:
  - adshield

enrollment:
  host: ""
  tls:
    secretName: adblock-recovery-sink-enrollment-tls

logLevel: info
logFormat: json

pki:
  existingSecret: ""
  keys:
    rootCert: root.crt
    intermediateCert: intermediate.crt
    intermediateKey: intermediate.key

serviceAccount:
  create: true
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

service:
  sink:
    type: ClusterIP
    loadBalancerIP: ""
    annotations: {}
    externalTrafficPolicy: ""

routing:
  mode: traefik
  traefik:
    entryPoints:
      - websecure
    annotations: {}
  gateway:
    tlsParentRefs: []
    httpParentRefs: []
  ingress:
    className: ""
    annotations: {}

networkPolicy:
  enabled: true
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
  metricsFrom: []

serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

certificate:
  enabled: false
  issuerRef: {}

vpa:
  enabled: false
  updateMode: "Off"
  minAllowed: {}
  maxAllowed: {}

pdb:
  enabled: false
  minAvailable: 1

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
