image:
  repository: registry.gitlab.com/ptrck-sh/adblock-recovery-sink
  pullPolicy: IfNotPresent
  tag: ""
  digest: ""

nameOverride: ""
fullnameOverride: ""

replicaCount: 1

imagePullSecrets: []

interception:
  hosts:
    - html-load.com

profiles:
  - adshield

enrollment:
  host: ""
  tls:
    secretName: ""

logLevel: info
logFormat: json

pki:
  existingSecret: ""
  keys:
    rootCert: root.crt
    intermediateCert: intermediate.crt
    intermediateKey: intermediate.key

serviceAccount:
  create: true
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi

containerPorts:
  sink: 8443
  ops: 8080

extraEnv: []

strategy: {}
priorityClassName: ""
terminationGracePeriodSeconds: 30
revisionHistoryLimit: 3

livenessProbe:
  httpGet:
    path: /healthz
    port: ops

readinessProbe:
  httpGet:
    path: /readyz
    port: ops
  periodSeconds: 5

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

service:
  sink:
    type: ClusterIP
    port: 443
    loadBalancerIP: ""
    annotations: {}
    labels: {}
    externalTrafficPolicy: ""
  ops:
    port: 8080
    annotations: {}
    labels: {}

routing:
  mode: traefik
  traefik:
    entryPoints:
      - websecure
    enrollmentEntryPoints: []
    certResolver: ""
    annotations: {}
  gateway:
    tlsParentRefs: []
    httpParentRefs: []
  ingress:
    className: ""
    annotations: {}

networkPolicy:
  enabled: true
  ingressFrom: []
  metricsFrom: []

serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

certificate:
  enabled: false
  issuerRef: {}

vpa:
  enabled: false
  updateMode: "Off"
  minAllowed: {}
  maxAllowed: {}

pdb:
  enabled: false
  minAvailable: 1

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
