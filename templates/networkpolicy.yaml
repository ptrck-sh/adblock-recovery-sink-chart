{{- include "ars.validate" . -}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ars.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "ars.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ars.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: sink
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    - ports:
        - protocol: TCP
          port: ops
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml (concat . $.Values.networkPolicy.metricsFrom) | nindent 8 }}
      {{- end }}
  egress: []
{{- end }}
