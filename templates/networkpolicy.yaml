{{- include "ars.validate" . -}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ars.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "ars.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ars.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: sink
    - from:
        {{- toYaml (concat .Values.networkPolicy.ingressFrom .Values.networkPolicy.metricsFrom) | nindent 8 }}
      ports:
        - protocol: TCP
          port: ops
  egress: []
{{- end }}
