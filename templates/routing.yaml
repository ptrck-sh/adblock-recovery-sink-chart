{{- include "ars.validate" . -}}
{{- if .Values.interception.traefik.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: {{ include "ars.fullname" . }}-sink
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "ars.labels" . | nindent 4 }}
  {{- with .Values.interception.traefik.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  entryPoints:
    {{- toYaml .Values.interception.traefik.entryPoints | nindent 4 }}
  routes:
    - match: {{ include "ars.sniMatch" . | quote }}
      services:
        - name: {{ include "ars.fullname" . }}-sink
          port: {{ .Values.service.sink.port }}
  tls:
    passthrough: true
{{- end }}
{{- if and .Values.gateway.enabled .Values.gateway.tlsRoute.parentRefs }}
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: {{ include "ars.fullname" . }}-sink
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "ars.labels" . | nindent 4 }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.gateway.tlsRoute.parentRefs | nindent 4 }}
  hostnames:
    {{- toYaml .Values.interception.hosts | nindent 4 }}
  rules:
    - backendRefs:
        - name: {{ include "ars.fullname" . }}-sink
          port: {{ .Values.service.sink.port }}
{{- end }}
{{- if and .Values.gateway.enabled .Values.gateway.httpRoute.parentRefs }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "ars.fullname" . }}-ops
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "ars.labels" . | nindent 4 }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.gateway.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    - {{ .Values.hostname | quote }}
  rules:
    {{- range $path := list "/status" "/install" "/ca.crt" "/ca.pem" "/ca-chain.pem" "/fingerprint" }}
    - matches:
        - path:
            type: Exact
            value: {{ $path | quote }}
      backendRefs:
        - name: {{ include "ars.fullname" $ }}-ops
          port: {{ $.Values.service.ops.port }}
    {{- end }}
{{- end }}
{{- if .Values.ingress.enabled }}
{{- $hosts := .Values.ingress.hosts }}
{{- if not $hosts }}
{{- $hosts = list (dict "host" .Values.hostname) }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ars.fullname" . }}-ops
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "ars.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $entry := $hosts }}
    - host: {{ $entry.host | quote }}
      http:
        paths:
          {{- range $path := list "/status" "/install" "/ca.crt" "/ca.pem" "/ca-chain.pem" "/fingerprint" }}
          - path: {{ $path | quote }}
            pathType: Exact
            backend:
              service:
                name: {{ include "ars.fullname" $ }}-ops
                port:
                  number: {{ $.Values.service.ops.port }}
          {{- end }}
    {{- end }}
{{- end }}
