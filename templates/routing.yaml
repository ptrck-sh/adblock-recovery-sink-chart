{{- include "ars.validate" . -}}
{{- if eq .Values.routing.mode "traefik" }}
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: {{ include "ars.fullname" . }}-sink
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "ars.labels" . | nindent 4 }}
  {{- with .Values.routing.traefik.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  entryPoints:
    {{- toYaml .Values.routing.traefik.entryPoints | nindent 4 }}
  routes:
    - match: {{ include "ars.sniMatch" . | quote }}
      services:
        - name: {{ include "ars.fullname" . }}-sink
          port: {{ .Values.service.sink.port }}
  tls:
    passthrough: true
{{- if .Values.enrollment.host }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "ars.fullname" . }}-enrollment
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "ars.labels" . | nindent 4 }}
  {{- with .Values.routing.traefik.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  entryPoints:
    {{- toYaml (default .Values.routing.traefik.entryPoints .Values.routing.traefik.enrollmentEntryPoints) | nindent 4 }}
  routes:
    - match: {{ include "ars.enrollmentMatch" . | quote }}
      kind: Rule
      services:
        - name: {{ include "ars.fullname" . }}-ops
          port: {{ .Values.service.ops.port }}
  tls:
    {{- if .Values.routing.traefik.certResolver }}
    certResolver: {{ .Values.routing.traefik.certResolver | quote }}
    {{- else }}
    secretName: {{ include "ars.enrollmentTLSSecretName" . | quote }}
    {{- end }}
{{- end }}
{{- else if eq .Values.routing.mode "gateway" }}
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: {{ include "ars.fullname" . }}-sink
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "ars.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.routing.gateway.tlsParentRefs | nindent 4 }}
  hostnames:
    {{- toYaml .Values.interception.hosts | nindent 4 }}
  rules:
    - backendRefs:
        - name: {{ include "ars.fullname" . }}-sink
          port: {{ .Values.service.sink.port }}
{{- if .Values.enrollment.host }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "ars.fullname" . }}-enrollment
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "ars.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.routing.gateway.httpParentRefs | nindent 4 }}
  hostnames:
    - {{ .Values.enrollment.host | quote }}
  rules:
    {{- range $path := list "/install" "/ca.crt" "/ca.pem" "/ca-chain.pem" "/fingerprint" }}
    - matches:
        - path:
            type: Exact
            value: {{ $path | quote }}
      backendRefs:
        - name: {{ include "ars.fullname" $ }}-ops
          port: {{ $.Values.service.ops.port }}
    {{- end }}
{{- end }}
{{- else if and (eq .Values.routing.mode "ingress") .Values.enrollment.host }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ars.fullname" . }}-enrollment
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "ars.labels" . | nindent 4 }}
  {{- with .Values.routing.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.routing.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  tls:
    - hosts:
        - {{ .Values.enrollment.host | quote }}
      secretName: {{ include "ars.enrollmentTLSSecretName" . | quote }}
  rules:
    - host: {{ .Values.enrollment.host | quote }}
      http:
        paths:
          {{- range $path := list "/install" "/ca.crt" "/ca.pem" "/ca-chain.pem" "/fingerprint" }}
          - path: {{ $path | quote }}
            pathType: Exact
            backend:
              service:
                name: {{ include "ars.fullname" $ }}-ops
                port:
                  number: {{ $.Values.service.ops.port }}
          {{- end }}
{{- end }}
