{{- include "ars.validate" . -}}
{{- if .Values.certificate.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "ars.fullname" . }}-tls
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "ars.labels" . | nindent 4 }}
spec:
  secretName: {{ include "ars.tlsSecretName" . | quote }}
  issuerRef:
    {{- toYaml .Values.certificate.issuerRef | nindent 4 }}
  dnsNames:
    - {{ .Values.hostname | quote }}
{{- end }}
