suite: routing
release:
  name: rel
  namespace: test
tests:
  - it: renders the default Traefik TLS passthrough route without a catch-all
    templates:
      - templates/routing.yaml
    set:
      pki.existingSecret: pki
    capabilities:
      apiVersions:
        - traefik.io/v1alpha1
    asserts:
      - containsDocument:
          kind: IngressRouteTCP
          apiVersion: traefik.io/v1alpha1
          name: rel-adblock-recovery-sink-sink
      - equal:
          path: spec.routes[0].match
          value: HostSNI(`html-load.com`)
      - equal:
          path: spec.tls.passthrough
          value: true
      - notMatchRegex:
          path: spec.routes[0].match
          pattern: "\\*"

  - it: applies Traefik annotations to the interception route
    templates:
      - templates/routing.yaml
    set:
      pki.existingSecret: pki
      interception.traefik.annotations:
        kubernetes.io/ingress.class: traefik-external
    capabilities:
      apiVersions:
        - traefik.io/v1alpha1
    asserts:
      - equal:
          path: metadata.annotations["kubernetes.io/ingress.class"]
          value: traefik-external

  - it: renders an Ingress with the fixed public paths and configured TLS
    templates:
      - templates/routing.yaml
    set:
      pki.existingSecret: pki
      hostname: status.example.com
      ingress.enabled: true
      ingress.className: nginx
      ingress.annotations:
        cert-manager.io/cluster-issuer: issuer
      ingress.tls:
        - secretName: status-tls
          hosts:
            - status.example.com
    capabilities:
      apiVersions:
        - traefik.io/v1alpha1
    asserts:
      - containsDocument:
          kind: Ingress
          apiVersion: networking.k8s.io/v1
          name: rel-adblock-recovery-sink-ops
        documentIndex: 1
      - equal:
          path: spec.ingressClassName
          value: nginx
        documentIndex: 1
      - equal:
          path: spec.rules[0].host
          value: status.example.com
        documentIndex: 1
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /status
        documentIndex: 1
      - equal:
          path: spec.rules[0].http.paths[5].path
          value: /fingerprint
        documentIndex: 1
      - equal:
          path: spec.rules[0].http.paths[0].pathType
          value: Exact
        documentIndex: 1
      - notContains:
          path: spec.rules[0].http.paths
          content:
            path: /
        documentIndex: 1
      - equal:
          path: spec.tls[0].secretName
          value: status-tls
        documentIndex: 1

  - it: renders configured Ingress hosts and custom ops port
    templates:
      - templates/routing.yaml
    set:
      pki.existingSecret: pki
      ingress.enabled: true
      ingress.hosts:
        - host: install.example.com
      service.ops.port: 18080
    capabilities:
      apiVersions:
        - traefik.io/v1alpha1
    asserts:
      - equal:
          path: spec.rules[0].host
          value: install.example.com
        documentIndex: 1
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 18080
        documentIndex: 1

  - it: renders Gateway API routes with fixed public paths
    templates:
      - templates/routing.yaml
    set:
      pki.existingSecret: pki
      hostname: status.example.com
      gateway.enabled: true
      gateway.annotations:
        example.com/exposure: public
      gateway.tlsRoute.parentRefs:
        - name: shared-gateway
          sectionName: tls
      gateway.httpRoute.parentRefs:
        - name: shared-gateway
          sectionName: https
    capabilities:
      apiVersions:
        - traefik.io/v1alpha1
        - gateway.networking.k8s.io/v1alpha2/TLSRoute
        - gateway.networking.k8s.io/v1/HTTPRoute
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: spec.hostnames[0]
          value: html-load.com
        documentIndex: 1
      - equal:
          path: spec.hostnames[0]
          value: status.example.com
        documentIndex: 2
      - equal:
          path: spec.rules[0].matches[0].path.value
          value: /status
        documentIndex: 2
      - equal:
          path: spec.rules[5].matches[0].path.value
          value: /fingerprint
        documentIndex: 2
      - equal:
          path: metadata.annotations["example.com/exposure"]
          value: public
        documentIndex: 1
      - equal:
          path: metadata.annotations["example.com/exposure"]
          value: public
        documentIndex: 2

  - it: renders a Gateway TLSRoute independently with custom sink port
    templates:
      - templates/routing.yaml
    set:
      pki.existingSecret: pki
      interception.traefik.enabled: false
      gateway.enabled: true
      gateway.tlsRoute.parentRefs:
        - name: shared-gateway
      service.sink.port: 10443
    capabilities:
      apiVersions:
        - gateway.networking.k8s.io/v1alpha2/TLSRoute
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 10443
