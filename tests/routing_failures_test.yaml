suite: routing failures
templates:
  - templates/routing.yaml
tests:
  - it: fails without the Traefik API when interception is enabled
    set:
      pki.existingSecret: pki
    asserts:
      - failedTemplate:
          errorMessage: interception.traefik.enabled=true requires the traefik.io/v1alpha1 API

  - it: fails when intercepted TLS has no unterminated path to the sink
    set:
      pki.existingSecret: pki
      interception.traefik.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: intercepted TLS must reach the sink unterminated

  - it: fails without the Gateway TLSRoute API
    set:
      pki.existingSecret: pki
      interception.traefik.enabled: false
      gateway.enabled: true
      gateway.tlsRoute.parentRefs:
        - name: shared-gateway
    asserts:
      - failedTemplate:
          errorMessage: gateway.tlsRoute.parentRefs requires the gateway.networking.k8s.io/v1alpha2/TLSRoute API

  - it: fails when an HTTPRoute has no hostname
    set:
      pki.existingSecret: pki
      gateway.enabled: true
      gateway.httpRoute.parentRefs:
        - name: shared-gateway
    capabilities:
      apiVersions:
        - traefik.io/v1alpha1
    asserts:
      - failedTemplate:
          errorMessage: gateway.httpRoute.parentRefs requires hostname

  - it: fails when enabled Ingress has no host
    set:
      pki.existingSecret: pki
      ingress.enabled: true
    capabilities:
      apiVersions:
        - traefik.io/v1alpha1
    asserts:
      - failedTemplate:
          errorMessage: ingress.enabled=true requires ingress.hosts or hostname
