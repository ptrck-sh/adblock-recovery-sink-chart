suite: routing failures
templates:
  - templates/routing.yaml
tests:
  - it: fails without the Traefik API
    set:
      pki.existingSecret: pki
    asserts:
      - failedTemplate:
          errorMessage: routing.mode=traefik requires the traefik.io/v1alpha1 API

  - it: fails Ingress mode without direct sink exposure
    set:
      pki.existingSecret: pki
      routing.mode: ingress
    asserts:
      - failedTemplate:
          errorMessage: routing.mode=ingress requires service.sink.type to be LoadBalancer or NodePort because standard Ingress cannot pass TLS through

  - it: fails Gateway mode without the TLSRoute API
    set:
      pki.existingSecret: pki
      routing.mode: gateway
      routing.gateway.tlsParentRefs:
        - name: shared-gateway
    asserts:
      - failedTemplate:
          errorMessage: routing.mode=gateway requires the gateway.networking.k8s.io/v1alpha2/TLSRoute API
