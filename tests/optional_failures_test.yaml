suite: optional resource failures
templates:
  - templates/configmap.yaml
tests:
  - it: fails extra environment PKI overrides
    set:
      pki.existingSecret: pki
      extraEnv:
        - name: ARS_PKI_ROOT_CERT
          value: overridden
    capabilities:
      apiVersions:
        - traefik.io/v1alpha1
    asserts:
      - failedTemplate:
          errorMessage: extraEnv entries must not use names beginning with ARS_PKI_

  - it: fails active HPA and VPA together
    set:
      pki.existingSecret: pki
      hpa.enabled: true
      vpa.enabled: true
      vpa.updateMode: Auto
    capabilities:
      apiVersions:
        - traefik.io/v1alpha1
        - autoscaling.k8s.io/v1
    asserts:
      - failedTemplate:
          errorMessage: hpa.enabled and vpa.enabled require vpa.updateMode to be Off

  - it: fails an enabled certificate without a hostname
    set:
      pki.existingSecret: pki
      certificate.enabled: true
      certificate.issuerRef.name: issuer
    capabilities:
      apiVersions:
        - traefik.io/v1alpha1
        - cert-manager.io/v1
    asserts:
      - failedTemplate:
          errorMessage: certificate.enabled=true requires hostname
