stages:
  - lint
  - test
  - publish
include:
  - component: $CI_SERVER_FQDN/ptrck-sh/templates/ci-templates/base@0.23.0
    inputs:
      runner_tags:
        - homelab
  - component: $CI_SERVER_FQDN/ptrck-sh/templates/ci-templates/pre-commit@0.23.0
  - component: $CI_SERVER_FQDN/ptrck-sh/templates/ci-templates/security@0.23.0
  - component: $CI_SERVER_FQDN/ptrck-sh/templates/ci-templates/alint-fix@0.23.0
  - component: $CI_SERVER_FQDN/ptrck-sh/templates/ci-templates/helm@0.23.0
    inputs:
      image: alpine/helm:3.21.2

helm:publish:
  before_script:
    - apk add --no-cache curl

init:helm:
  rules:
    - if: $CI_COMMIT_TAG
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
      when: never
    - if: $CI_COMMIT_BRANCH

helm:lint:
  stage: lint
  image:
    name: alpine/helm:4.3.0
    entrypoint: [""]
  script:
    - helm lint . --set pki.existingSecret=ci --set ingress.enabled=false --set service.sink.type=LoadBalancer
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH

helm:unittest:
  stage: test
  image:
    name: alpine/helm:4.3.0
    entrypoint: [""]
  before_script:
    - apk add --no-cache git
  script:
    - helm plugin install --verify=false https://github.com/helm-unittest/helm-unittest
    - helm unittest .
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH

helm:verify-image:
  stage: test
  image:
    name: alpine/helm:4.3.0
    entrypoint: [""]
  variables:
    IMAGE_REPOSITORY: quay.io/ptrck-sh/adblock-recovery-sink
  before_script:
    - apk add --no-cache curl
  script:
    - 'IMAGE="$(helm template image-check . --set pki.existingSecret=ci --set ingress.enabled=false --set service.sink.type=LoadBalancer | awk ''/^          image: / {gsub(/"/, "", $2); print $2; exit}'')"'
    - echo "resolved image $IMAGE"
    - test "${IMAGE%%[:@]*}" = "$IMAGE_REPOSITORY"
    - REFERENCE="${IMAGE#$IMAGE_REPOSITORY}"
    - REFERENCE="${REFERENCE#?}"
    - 'curl --fail --silent --show-error --output /dev/null --header "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" "https://quay.io/v2/${IMAGE_REPOSITORY#quay.io/}/manifests/$REFERENCE"'
  rules:
    - if: $CI_COMMIT_TAG
